<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Northstar Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="index.html">Northstar Studio</a>
    <nav aria-label="Main navigation">
      <ul class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p>Have a project in mind? Tell us a little about your business and what you would like to create.</p>

    <form class="contact-form" name="contact" method="POST" data-netlify="true">
      <input type="hidden" name="form-name" value="contact">
      <p>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </p>
      <p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </p>
      <p>
        <label for="message">Project details</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </p>
      <button type="submit">Send message</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Northstar Studio. All rights reserved.</p>
    <nav aria-label="Footer navigation">
      <ul class="navigation">
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </footer>
</body>
</html>
